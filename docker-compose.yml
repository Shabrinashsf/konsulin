services:
  postgres-test:
    image: postgres:16
    environment:
      POSTGRES_USER: konsulin
      POSTGRES_PASSWORD: konsulin
      POSTGRES_DB: konsulin_test
    ports:
      - '5433:5432'
    tmpfs:
      - /var/lib/postgresql/data
    
  mailpit:
    image: axllent/mailpit
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # UI web for email